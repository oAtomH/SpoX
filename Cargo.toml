[package]
name = "spox"
version = "0.12.1"
edition = "2021"
description = "SpoX - a tiny pixel-art Spotify mini player built on Spotify Soloist"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
include_dir = "0.7"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
cpal = "0.15"
tray-icon = "0.21"
souvlaki = "0.8"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security", "Win32_System_Pipes", "Win32_UI_Accessibility"] }
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
