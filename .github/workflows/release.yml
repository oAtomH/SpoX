# Builds SpoX on GitHub's Windows machines and publishes a release.
# It runs by itself whenever the version in Cargo.toml changes on main
# (or by hand: Actions tab > Release > Run workflow). Each version is released once.
name: Release

on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT
          gh release view "v$ver" 2>$null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.v.outputs.exists == 'false'

      - uses: Swatinem/rust-cache@v2
        if: steps.v.outputs.exists == 'false'

      - name: Build SpoX.exe
        if: steps.v.outputs.exists == 'false'
        run: cargo build --release

      - name: Build the setup wizard (Inno Setup)
        if: steps.v.outputs.exists == 'false'
        shell: pwsh
        run: |
          Copy-Item target\release\spox.exe SpoX.exe
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\SpoX.iss

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: SpoX ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            SpoX.exe
            SpoX-Setup-*.exe
          generate_release_notes: true

  # SpoX for Android: built after the Windows release exists, added to the same release
  android:
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key (from the repo secrets, if set)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/spox.jks"; echo "SPOX_KEYSTORE_FILE=$RUNNER_TEMP/spox.jks" >> "$GITHUB_ENV"; else echo "No ANDROID_KEYSTORE secret: using a debug key"; fi
      - name: SpoX Engine helpers (spoxrun + sound bridge)
        run: |
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu >/dev/null
          sh android/native/build.sh
      - name: Build SpoX.apk
        env:
          SPOX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android :app:assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk SpoX.apk
      - name: Add to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: SpoX.apk
