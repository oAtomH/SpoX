# Test-builds SpoX for Android whenever its code changes and puts it on the
# "android-preview" pre-release page.
name: Android build

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key (from the repo secrets, if set)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/spox.jks"; echo "SPOX_KEYSTORE_FILE=$RUNNER_TEMP/spox.jks" >> "$GITHUB_ENV"; fi
      - name: Build
        env:
          SPOX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Check the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk SpoX.apk
          ls -la SpoX.apk
          echo "skin files inside: $(unzip -l SpoX.apk | grep -c 'assets/skin/')"
      # a "preview" pre-release to install on the phone straight from GitHub (the normal
      # releases stay what the Windows app updates from)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: SpoX for Android (preview)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: Test build of SpoX for Android, made from the newest code. Open this page on your phone and tap SpoX.apk.
          files: SpoX.apk
