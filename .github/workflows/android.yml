# Test-builds SpoX for Android whenever its code changes (no release). The APK is kept as a
# download on the run's page for a week.
name: Android build

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key (from the repo secrets, if set)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/spox.jks"; echo "SPOX_KEYSTORE_FILE=$RUNNER_TEMP/spox.jks" >> "$GITHUB_ENV"; fi
      - name: Build
        env:
          SPOX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpoX-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
